<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>CoolSchool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Conversations">
      <div class="sidebar-top">
        <div class="brand-row">
          <div>
            <div class="eyebrow">MESSAGES</div>
            <h1>CoolSchool</h1>
          </div>
          <button class="icon-btn new-btn" id="newConversationBtn" aria-label="New message" title="New message">＋</button>
        </div>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Search" autocomplete="off">
          <button class="clear-search" id="clearSearch" aria-label="Clear search">×</button>
        </label>
      </div>

      <div class="filter-row">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="unread">Unread</button>
        <button class="filter" data-filter="pinned">Pinned</button>
      </div>

      <div class="conversation-list" id="conversationList"></div>

      <div class="sidebar-bottom">
        <button class="bottom-btn" id="settingsBtn"><span>⚙</span> Settings</button>
        <div class="local-note">Local demo · nothing is sent anywhere</div>
      </div>
    </aside>

    <main class="chat-panel" id="chatPanel">
      <header class="chat-header">
        <button class="icon-btn back-btn" id="backBtn" aria-label="Back to conversations">‹</button>
        <button class="contact-button" id="contactInfoBtn" aria-label="Conversation details">
          <span class="avatar large" id="headerAvatar"></span>
          <span class="header-copy">
            <strong id="headerName">Select a conversation</strong>
            <small id="headerStatus"></small>
          </span>
        </button>
        <button class="icon-btn" id="headerMoreBtn" aria-label="Conversation options">•••</button>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty-chat">
          <div class="empty-icon">💬</div>
          <h2>CoolSchool</h2>
          <p>Pick a conversation to get started.</p>
        </div>
      </section>

      <form class="composer" id="composer">
        <button type="button" class="composer-btn" id="attachBtn" aria-label="Add attachment">＋</button>
        <div class="composer-field">
          <input id="messageInput" aria-label="Message" placeholder="iMessage" maxlength="1000" autocomplete="off">
          <button type="button" class="emoji-btn" id="emojiBtn" aria-label="Add emoji">☺</button>
        </div>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>↑</button>
      </form>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">New Message</h2>
        <button class="icon-btn" id="closeModal" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
