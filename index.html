<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>SimpleChat</h1>
        <p id="status">Connecting...</p>
      </div>
      <button id="changeNameBtn" class="ghost">Change name</button>
    </header>

    <section id="nameScreen" class="name-screen">
      <div class="card">
        <h2>Welcome 👋</h2>
        <p>Choose a username to enter the chat.</p>
        <input id="nameInput" maxlength="24" placeholder="Your username" autocomplete="off">
        <button id="joinBtn">Join chat</button>
      </div>
    </section>

    <section id="chatScreen" class="chat-screen hidden">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="messageForm" class="composer">
        <input id="messageInput" maxlength="500" placeholder="Type a message..." autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <!-- Firebase SDKs -->
  <script type="module" src="app.js"></script>
</body>
</html>
